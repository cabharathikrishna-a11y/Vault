name: Build Android APK and Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Calculate Version Info
        id: versioning
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          VERSION_NAME="1.${VERSION_CODE}"
          TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Build Android Release APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Locate APK File
        id: apk_file
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV
          echo "Found APK at: ${APK_PATH}"

      - name: Create GitHub Release and Upload APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Family Vault Release ${{ env.TAG_NAME }} (Version Code ${{ env.VERSION_CODE }})"
          body: |
            ## Family Vault Auto Release
            - **Version Code**: ${{ env.VERSION_CODE }}
            - **Version Name**: ${{ env.VERSION_NAME }}
            - **Release Tag**: ${{ env.TAG_NAME }}

            ### Realtime Database (RTDB) JSON Payload to trigger in-app updates:
            ```json
            {
              "versionCode": ${{ env.VERSION_CODE }},
              "versionName": "${{ env.VERSION_NAME }}",
              "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/app-release.apk",
              "releaseNotes": "Automatic update v${{ env.VERSION_NAME }} from GitHub push.",
              "forceUpdate": false
            }
            ```
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
